name: Publicar JUVENTUDE DIGITAL 360

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projeto/package-lock.json

      - name: Instalar dependências
        working-directory: projeto
        run: npm ci --legacy-peer-deps

      - name: Compilar site
        working-directory: projeto
        run: npm run build

      - name: Carregar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: projeto/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
